name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (format · types · build · package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version agreement (package.json ↔ jsr.json)
        run: pnpm check:versions
      - name: Format check (prettier)
        run: pnpm format:check
      - name: Type check
        run: pnpm type-check
      - name: Type check (examples · scripts)
        run: pnpm type-check:examples
      - name: Deprecated AI SDK usage
        run: pnpm check:deprecations
      - name: Build
        run: pnpm build
      - name: Package checks (publint + are-the-types-wrong)
        run: pnpm check:pkg
      - name: Smoke-test the packed tarball (ESM)
        run: |
          PKG=$(node -p "require('./package.json').name")
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/*.tgz ai zod >/dev/null
          node --input-type=module -e "import { createInterfaze, interfaze } from '$PKG'; if (!createInterfaze || !interfaze) process.exit(1)"

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan working tree for leaked tokens/secrets
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_8.21.2_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks dir . --redact --no-banner
